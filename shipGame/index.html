<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hex Ocean Trader Prototype - Draggable Multi-Windows</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      touch-action: none;
      user-select: none;
    }

    canvas {
      display: block;
    }

    /* Main UI */
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      font-family: sans-serif;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    #ui h3 {
      margin: 0 0 5px 0;
      font-size: 18px;
      color: #f1c40f;
    }

    #ui p {
      margin: 4px 0;
      font-size: 14px;
      color: #ddd;
    }

    /* Dynamic Trading Windows */
    .tradeWindow {
      position: absolute;
      background: #2c3e50;
      color: white;
      font-family: sans-serif;
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #f1c40f;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      min-width: 450px;
    }

    .trade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #7f8c8d;
      padding-bottom: 10px;
      margin-bottom: 15px;
      cursor: grab;
      /* Shows it can be dragged */
    }

    .trade-header:active {
      cursor: grabbing;
    }

    .trade-header h2 {
      margin: 0;
      color: #f1c40f;
      pointer-events: none;
    }

    .close-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .close-btn:hover {
      background: #c0392b;
    }

    .trade-warning {
      color: #e74c3c;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 8px;
      text-align: center;
      border-bottom: 1px solid #34495e;
    }

    th {
      color: #bdc3c7;
      font-size: 14px;
    }

    td {
      font-size: 15px;
    }

    .item-name {
      text-align: left;
      font-weight: bold;
    }

    .trade-btn {
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .trade-btn.sell {
      background: #2980b9;
    }

    .trade-btn:hover:not(:disabled) {
      filter: brightness(1.2);
    }

    .trade-btn:disabled {
      background: #7f8c8d;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .sail-btn {
      background: #3498db;
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="ui">
    <h3>Ocean Trader</h3>
    <p>🗺️ <b>Drag</b> to pan | 🔍 <b>Scroll</b> to zoom</p>
    <p>⚓ <b>Click</b> an ocean tile to sail.</p>
    <p>🏙️ <b>Click</b> a city to view the market.</p>
    <hr style="border-color: #444; margin: 10px 0;">
    <p>💰 Gold: <b id="uiGold" style="color:#f1c40f;">1000</b></p>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const HEX_SIZE = 25;
    const SQRT_3 = Math.sqrt(3);

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getHexKey(q, r) { return `${Math.round(q)},${Math.round(r)}`; }
    function hexToPixel(q, r) {
      const x = HEX_SIZE * SQRT_3 * (q + r / 2);
      const y = HEX_SIZE * 3 / 2 * r;
      return { x, y };
    }
    function pixelToHex(x, y) {
      const q = (SQRT_3 / 3 * x - 1 / 3 * y) / HEX_SIZE;
      const r = (2 / 3 * y) / HEX_SIZE;
      return hexRound(q, r, -q - r);
    }
    function hexRound(q, r, s) {
      let rq = Math.round(q);
      let rr = Math.round(r);
      let rs = Math.round(s);
      const qDiff = Math.abs(rq - q);
      const rDiff = Math.abs(rr - r);
      const sDiff = Math.abs(rs - s);
      if (qDiff > rDiff && qDiff > sDiff) rq = -rr - rs;
      else if (rDiff > sDiff) rr = -rq - rs;
      else rs = -rq - rr;
      return { q: rq, r: rr, s: rs };
    }
    function hexDistance(a, b) {
      return (Math.abs(a.q - b.q) + Math.abs(a.r - b.r) + Math.abs(a.s - b.s)) / 2;
    }

    // --- Camera System ---
    let camera = { x: 0, y: 0, zoom: 1.0 };
    let isDragging = false;
    let hasDragged = false;
    let dragStart = { x: 0, y: 0 };
    let cameraStart = { x: 0, y: 0 };

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomSensitivity = 0.1;
      if (e.deltaY < 0) camera.zoom = Math.min(3.0, camera.zoom + zoomSensitivity);
      else camera.zoom = Math.max(0.15, camera.zoom - zoomSensitivity);
    }, { passive: false });

    // --- Game Economy Data ---
    const GOODS = [
      { id: 'grain', name: 'Grain', basePrice: 15 },
      { id: 'wood', name: 'Wood', basePrice: 20 },
      { id: 'brick', name: 'Brick', basePrice: 30 },
      { id: 'sugar', name: 'Sugar', basePrice: 45 },
      { id: 'cloth', name: 'Cloth', basePrice: 60 },
      { id: 'tobacco', name: 'Tobacco', basePrice: 80 },
      { id: 'coffee', name: 'Coffee', basePrice: 100 },
      { id: 'rum', name: 'Rum', basePrice: 150 }
    ];

    let player = {
      gold: 1000,
      inventory: {}
    };
    GOODS.forEach(g => player.inventory[g.id] = 0);

    function updateUIGold() {
      document.getElementById('uiGold').innerText = player.gold;
    }

    // --- Map Generation ---
    function getAllNeighbors(hex) {
      const directions = [
        { q: 1, r: 0 }, { q: 1, r: -1 }, { q: 0, r: -1 },
        { q: -1, r: 0 }, { q: -1, r: 1 }, { q: 0, r: 1 }
      ];
      const neighbors = [];
      for (let dir of directions) {
        const neighbor = map.get(getHexKey(hex.q + dir.q, hex.r + dir.r));
        if (neighbor) neighbors.push(neighbor);
      }
      return neighbors;
    }

    const map = new Map();
    const MAP_RADIUS = 60;
    const cities = [];

    function generateMap() {
      const islands = [];
      for (let i = 0; i < 150; i++) {
        const q = Math.floor(Math.random() * (MAP_RADIUS * 2)) - MAP_RADIUS;
        const r = Math.floor(Math.random() * (MAP_RADIUS * 2)) - MAP_RADIUS;
        const radius = Math.floor(Math.random() * 6) + 2;
        islands.push({ q, r, radius });
      }

      function getRandomColor(type) {
        const variance = Math.random() * 2 - 1;
        if (type === 'ocean') return `hsl(204, 64%, ${44 + variance}%)`;
        if (type === 'land') return `hsl(145, 63%, ${42 + variance}%)`;
        if (type === 'beach') return `hsl(37, 90%, ${51 + variance}%)`;
        return 'black';
      }

      for (let q = -MAP_RADIUS; q <= MAP_RADIUS; q++) {
        const r1 = Math.max(-MAP_RADIUS, -q - MAP_RADIUS);
        const r2 = Math.min(MAP_RADIUS, -q + MAP_RADIUS);
        for (let r = r1; r <= r2; r++) {
          const s = -q - r;
          let type = 'ocean';
          let maxInfluence = -100;

          for (let isle of islands) {
            const dist = hexDistance({ q, r, s }, { q: isle.q, r: isle.r, s: -isle.q - isle.r });
            const influence = isle.radius - dist;
            if (influence > maxInfluence) maxInfluence = influence;
          }

          if (maxInfluence > 0) type = 'land';
          else if (maxInfluence === 0) type = 'beach';

          map.set(getHexKey(q, r), { q, r, s, type, color: getRandomColor(type), hasCity: false });
        }
      }

      for (let [key, hex] of map) {
        if (hex.type === 'land' || hex.type === 'beach') {
          const bordersOcean = getAllNeighbors(hex).some(n => n.type === 'ocean');
          if (bordersOcean && Math.random() < 0.03 && cities.length < 40) {
            const cityTooClose = cities.some(c => hexDistance(c, hex) < 3);
            if (!cityTooClose) {
              hex.hasCity = true;
              hex.inventory = {};
              GOODS.forEach(g => {
                hex.inventory[g.id] = Math.floor(Math.random() * 100) + 10;
              });
              cities.push(hex);
            }
          }
        }
      }
    }
    generateMap();

    // --- Off-Screen Caching ---
    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const mapPixelWidth = 8500;
    const mapPixelHeight = 8500;
    bgCanvas.width = mapPixelWidth;
    bgCanvas.height = mapPixelHeight;
    const mapOffsetX = mapPixelWidth / 2;
    const mapOffsetY = mapPixelHeight / 2;

    function prerenderMap() {
      bgCtx.fillStyle = '#1a1a1a';
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.save();
      bgCtx.translate(mapOffsetX, mapOffsetY);
      bgCtx.lineWidth = 1;
      bgCtx.strokeStyle = 'rgba(0,0,0,0.15)';

      for (let [key, hex] of map) {
        const pos = hexToPixel(hex.q, hex.r);
        bgCtx.beginPath();
        bgCtx.fillStyle = hex.color;
        for (let i = 0; i < 6; i++) {
          const angle = 2 * Math.PI / 6 * (i - 0.5);
          const hx = pos.x + HEX_SIZE * Math.cos(angle);
          const hy = pos.y + HEX_SIZE * Math.sin(angle);
          if (i === 0) bgCtx.moveTo(hx, hy);
          else bgCtx.lineTo(hx, hy);
        }
        bgCtx.closePath();
        bgCtx.fill();
        bgCtx.stroke();
      }

      for (let city of cities) {
        const pos = hexToPixel(city.q, city.r);
        bgCtx.fillStyle = '#ecf0f1';
        bgCtx.fillRect(pos.x - 15, pos.y - 5, 30, 20);
        bgCtx.fillStyle = '#c0392b';
        bgCtx.beginPath();
        bgCtx.moveTo(pos.x - 20, pos.y - 5);
        bgCtx.lineTo(pos.x, pos.y - 22);
        bgCtx.lineTo(pos.x + 20, pos.y - 5);
        bgCtx.closePath();
        bgCtx.fill();
        bgCtx.fillStyle = '#8e44ad';
        bgCtx.fillRect(pos.x - 4, pos.y + 5, 8, 10);
      }
      bgCtx.restore();
    }
    prerenderMap();

    // --- Ship Setup ---
    let spawnQ = 0, spawnR = 0;
    for (let [key, hex] of map) {
      if (hex.type === 'ocean') { spawnQ = hex.q; spawnR = hex.r; break; }
    }

    const ship = {
      q: spawnQ, r: spawnR, x: 0, y: 0,
      speed: 150.0, path: [], moving: false, targetTile: null
    };
    const startPos = hexToPixel(ship.q, ship.r);
    ship.x = startPos.x; ship.y = startPos.y;
    camera.x = -ship.x; camera.y = -ship.y;
    let clickIndicator = null;


    // ==========================================
    // --- Dynamic Window & Trading System ---
    // ==========================================
    const openWindows = {}; // Store all currently open windows
    let zIndexCounter = 100; // Keep track of the active window layer

    function getPrices(good, cityAmount) {
      const scarcity = Math.max(0, 120 - cityAmount) / 120;
      const buyPrice = Math.max(1, Math.floor(good.basePrice * (1 + scarcity * 2.0)));
      const sellPrice = Math.max(1, Math.floor(buyPrice * 0.75));
      return { buyPrice, sellPrice };
    }

    // Drag and drop function
    function makeDraggable(element, header) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      header.onpointerdown = dragMouseDown;

      function dragMouseDown(e) {
        e.preventDefault();
        element.style.zIndex = ++zIndexCounter; // Bring to front
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onpointerup = closeDragElement;
        document.onpointermove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        element.style.top = (element.offsetTop - pos2) + "px";
        element.style.left = (element.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onpointerup = null;
        document.onpointermove = null;
      }
    }

    function openTradeWindow(cityHex) {
      const cityKey = getHexKey(cityHex.q, cityHex.r);
      const safeId = cityKey.replace(',', '_'); // Create a CSS-safe ID without commas

      // If it's already open, just bring it to the front
      if (openWindows[cityKey]) {
        openWindows[cityKey].element.style.zIndex = ++zIndexCounter;
        return;
      }

      // Create new window DOM element
      const win = document.createElement('div');
      win.className = 'tradeWindow';
      win.id = 'window-' + safeId;
      win.style.zIndex = ++zIndexCounter;

      // Offset slightly based on how many windows are open so they don't stack perfectly
      const offset = Object.keys(openWindows).length * 30;
      win.style.left = (window.innerWidth / 2 - 225 + offset) + 'px';
      win.style.top = (window.innerHeight / 2 - 200 + offset) + 'px';

      win.innerHTML = `
                <div class="trade-header" id="header-${safeId}">
                    <h2>Coastal Port (${cityHex.q}, ${cityHex.r})</h2>
                    <button class="close-btn" onclick="closeTradeWindow('${cityKey}')">X</button>
                </div>
                <button id="sailBtn-${safeId}" class="trade-btn sail-btn" onclick="sailToCity('${cityKey}')">⚓ Set Sail for this City</button>
                <p id="warning-${safeId}" class="trade-warning">You must dock your ship at this city to trade!</p>
                <table>
                    <thead>
                        <tr>
                            <th style="text-align:left;">Good</th>
                            <th>Stock</th>
                            <th>Buy</th>
                            <th>Sell</th>
                            <th>Cargo</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-${safeId}"></tbody>
                </table>
            `;

      document.body.appendChild(win);

      // Store reference
      openWindows[cityKey] = {
        element: win,
        city: cityHex
      };

      // Initialize drag and drop using the safe ID
      makeDraggable(win, win.querySelector(`#header-${safeId}`));

      // Click anywhere on window brings it to front
      win.addEventListener('pointerdown', () => win.style.zIndex = ++zIndexCounter);

      refreshAllTradeWindows();
    }

    window.closeTradeWindow = function (cityKey) {
      if (openWindows[cityKey]) {
        document.body.removeChild(openWindows[cityKey].element);
        delete openWindows[cityKey];
      }
    };

    function refreshAllTradeWindows() {
      const shipHex = { q: ship.q, r: ship.r, s: -ship.q - ship.r };

      for (const key in openWindows) {
        const { city, element } = openWindows[key];
        const safeId = key.replace(',', '_'); // Match the CSS-safe ID 

        // Check if ship is docked near THIS specific city
        const dist = hexDistance(shipHex, city);
        const canTrade = (dist <= 1 && !ship.moving);

        const warningEl = element.querySelector(`#warning-${safeId}`);
        const sailBtn = element.querySelector(`#sailBtn-${safeId}`);
        const tbody = element.querySelector(`#tbody-${safeId}`);

        if (canTrade) {
          warningEl.style.display = 'none';
          sailBtn.style.display = 'none';
        } else {
          warningEl.style.display = 'block';
          sailBtn.style.display = 'block';
        }

        let html = '';
        GOODS.forEach(good => {
          const cityStock = city.inventory[good.id];
          const playerStock = player.inventory[good.id];
          const { buyPrice, sellPrice } = getPrices(good, cityStock);

          const canBuy = canTrade && cityStock > 0 && player.gold >= buyPrice;
          const canSell = canTrade && playerStock > 0;

          html += `
                <tr>
                    <td class="item-name">${good.name}</td>
                    <td>${cityStock}</td>
                    <td>${buyPrice}g</td>
                    <td>${sellPrice}g</td>
                    <td style="color:#f39c12; font-weight:bold;">${playerStock}</td>
                    <td>
                        <button class="trade-btn" onclick="buyGood('${good.id}', '${key}')" ${!canBuy ? 'disabled' : ''}>Buy</button>
                        <button class="trade-btn sell" onclick="sellGood('${good.id}', '${key}')" ${!canSell ? 'disabled' : ''}>Sell</button>
                    </td>
                </tr>
                    `;
        });
        tbody.innerHTML = html;
      }
    }

    window.buyGood = function (goodId, cityKey) {
      const city = openWindows[cityKey].city;
      const good = GOODS.find(g => g.id === goodId);
      const cityStock = city.inventory[goodId];
      const { buyPrice } = getPrices(good, cityStock);

      if (cityStock > 0 && player.gold >= buyPrice) {
        player.gold -= buyPrice;
        city.inventory[goodId]--;
        player.inventory[goodId]++;
        updateUIGold();
        refreshAllTradeWindows();
      }
    };

    window.sellGood = function (goodId, cityKey) {
      const city = openWindows[cityKey].city;
      const good = GOODS.find(g => g.id === goodId);
      const cityStock = city.inventory[goodId];
      const { sellPrice } = getPrices(good, cityStock);

      if (player.inventory[goodId] > 0) {
        player.gold += sellPrice;
        city.inventory[goodId]++;
        player.inventory[goodId]--;
        updateUIGold();
        refreshAllTradeWindows();
      }
    };

    window.sailToCity = function (cityKey) {
      const city = openWindows[cityKey].city;
      let targetTile = city;

      const oceanNeighbors = getOceanNeighbors(targetTile);
      if (oceanNeighbors.length > 0) {
        const shipHex = { q: ship.q, r: ship.r, s: -ship.q - ship.r };
        oceanNeighbors.sort((a, b) => hexDistance(shipHex, a) - hexDistance(shipHex, b));
        targetTile = oceanNeighbors[0];
      }

      let startTile = map.get(getHexKey(ship.moving ? pixelToHex(ship.x, ship.y).q : ship.q, ship.moving ? pixelToHex(ship.x, ship.y).r : ship.r));
      if (!startTile) startTile = map.get(getHexKey(ship.q, ship.r));

      if (startTile && targetTile && targetTile.type === 'ocean') {
        const calculatedPath = findPath(startTile, targetTile);
        if (calculatedPath.length > 0) {
          ship.path = calculatedPath;
          ship.moving = true;
          ship.targetTile = targetTile;
        }
      }
    };

    // --- Pathfinding ---
    function getOceanNeighbors(hex) {
      return getAllNeighbors(hex).filter(n => n.type === 'ocean');
    }

    function findPath(start, goal) {
      if (start.q === goal.q && start.r === goal.r) return [];
      const openSet = [start];
      const cameFrom = new Map();
      const gScore = new Map();
      const fScore = new Map();

      const startKey = getHexKey(start.q, start.r);
      gScore.set(startKey, 0);
      fScore.set(startKey, hexDistance(start, goal));

      let safetyLimit = 0;
      while (openSet.length > 0 && safetyLimit < 15000) {
        safetyLimit++;
        openSet.sort((a, b) => (fScore.get(getHexKey(a.q, a.r)) ?? Infinity) - (fScore.get(getHexKey(b.q, b.r)) ?? Infinity));

        const current = openSet.shift();
        const currentKey = getHexKey(current.q, current.r);

        if (current.q === goal.q && current.r === goal.r) {
          const path = [];
          let curr = current;
          let currKey = getHexKey(curr.q, curr.r);
          while (cameFrom.has(currKey)) {
            path.unshift(curr);
            curr = cameFrom.get(currKey);
            currKey = getHexKey(curr.q, curr.r);
          }
          return path;
        }

        for (let neighbor of getOceanNeighbors(current)) {
          const neighborKey = getHexKey(neighbor.q, neighbor.r);
          const tentative_gScore = (gScore.get(currentKey) ?? Infinity) + 1;
          if (tentative_gScore < (gScore.get(neighborKey) ?? Infinity)) {
            cameFrom.set(neighborKey, current);
            gScore.set(neighborKey, tentative_gScore);
            fScore.set(neighborKey, tentative_gScore + hexDistance(neighbor, goal));
            if (!openSet.some(n => n.q === neighbor.q && n.r === neighbor.r)) openSet.push(neighbor);
          }
        }
      }
      return [];
    }

    // --- Input Handling ---
    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      hasDragged = false;
      dragStart.x = e.clientX;
      dragStart.y = e.clientY;
      cameraStart.x = camera.x;
      cameraStart.y = camera.y;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (isDragging) {
        const dx = (e.clientX - dragStart.x) / camera.zoom;
        const dy = (e.clientY - dragStart.y) / camera.zoom;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) hasDragged = true;
        camera.x = cameraStart.x + dx;
        camera.y = cameraStart.y + dy;
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      isDragging = false;
      if (!hasDragged) {
        handleMapClick(e.clientX, e.clientY);
      }
    });

    function handleMapClick(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      let clickX = (clientX - rect.left) - (canvas.width / 2);
      let clickY = (clientY - rect.top) - (canvas.height / 2);
      clickX /= camera.zoom; clickY /= camera.zoom;
      clickX -= camera.x; clickY -= camera.y;

      const clickedHex = pixelToHex(clickX, clickY);
      const hexKey = getHexKey(clickedHex.q, clickedHex.r);
      let targetTile = map.get(hexKey);

      if (targetTile) {
        const pos = hexToPixel(clickedHex.q, clickedHex.r);
        clickIndicator = { x: pos.x, y: pos.y, radius: HEX_SIZE, alpha: 1.0 };
      }

      if (targetTile && targetTile.hasCity) {
        openTradeWindow(targetTile);
      } else if (targetTile && targetTile.type === 'ocean') {
        let startTile = map.get(getHexKey(ship.moving ? pixelToHex(ship.x, ship.y).q : ship.q, ship.moving ? pixelToHex(ship.x, ship.y).r : ship.r));
        if (!startTile) startTile = map.get(getHexKey(ship.q, ship.r));

        if (startTile) {
          const calculatedPath = findPath(startTile, targetTile);
          if (calculatedPath.length > 0) {
            ship.path = calculatedPath;
            ship.moving = true;
            ship.targetTile = targetTile;
            refreshAllTradeWindows();
          }
        }
      }
    }

    // --- Rendering Components ---
    function drawShip() {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.lineWidth = 1 / camera.zoom;
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.moveTo(-27, -9);
      ctx.lineTo(27, -9);
      ctx.lineTo(18, 9);
      ctx.lineTo(-18, 9);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#5c2a07';
      ctx.fillRect(-3, -30, 6, 30);
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.moveTo(3, -6);
      ctx.lineTo(3, -27);
      ctx.lineTo(24, -6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawPath() {
      if (!ship.moving || ship.path.length === 0) return;
      ctx.beginPath();
      ctx.moveTo(ship.x, ship.y);
      for (let node of ship.path) {
        const pos = hexToPixel(node.q, node.r);
        ctx.lineTo(pos.x, pos.y);
      }
      ctx.strokeStyle = '#e74c3c';
      ctx.lineWidth = 4 / camera.zoom;
      ctx.setLineDash([8 / camera.zoom, 6 / camera.zoom]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawClickIndicator() {
      if (!clickIndicator) return;
      ctx.beginPath();
      ctx.arc(clickIndicator.x, clickIndicator.y, clickIndicator.radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 255, 255, ${clickIndicator.alpha})`;
      ctx.lineWidth = 4 / camera.zoom;
      ctx.stroke();
      clickIndicator.radius += 2 / camera.zoom;
      clickIndicator.alpha -= 0.04;
      if (clickIndicator.alpha <= 0) clickIndicator = null;
    }

    // --- Game Loop ---
    function update(dt) {
      if (ship.moving && ship.path.length > 0) {
        const targetNode = ship.path[0];
        const targetPos = hexToPixel(targetNode.q, targetNode.r);
        const dx = targetPos.x - ship.x;
        const dy = targetPos.y - ship.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const step = ship.speed * dt;

        if (distance < step) {
          ship.x = targetPos.x;
          ship.y = targetPos.y;
          ship.q = targetNode.q;
          ship.r = targetNode.r;
          ship.path.shift();

          if (ship.path.length === 0) {
            ship.moving = false;
            ship.targetTile = null;

            // Arrived! Tell all open windows to enable trade buttons if applicable
            refreshAllTradeWindows();
          }
        } else {
          ship.x += (dx / distance) * step;
          ship.y += (dy / distance) * step;
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(camera.x, camera.y);

      ctx.drawImage(bgCanvas, -mapOffsetX, -mapOffsetY);

      if (ship.moving && ship.targetTile) {
        if (Math.sin(Date.now() / 150) > 0) {
          const pos = hexToPixel(ship.targetTile.q, ship.targetTile.r);
          ctx.beginPath();
          ctx.fillStyle = '#5dade2';
          for (let i = 0; i < 6; i++) {
            const angle = 2 * Math.PI / 6 * (i - 0.5);
            const hx = pos.x + HEX_SIZE * Math.cos(angle);
            const hy = pos.y + HEX_SIZE * Math.sin(angle);
            if (i === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.closePath();
          ctx.lineWidth = 1 / camera.zoom;
          ctx.strokeStyle = 'rgba(0,0,0,0.15)';
          ctx.fill();
          ctx.stroke();
        }
      }

      drawPath();
      drawClickIndicator();
      drawShip();

      ctx.restore();
    }

    let lastTime = 0;
    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      const safeDt = Math.min(dt, 0.1);

      update(safeDt);
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
