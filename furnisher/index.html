<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Room Layout Planner</title>
  <style>
    :root {
      --bg-color: #121212;
      --sidebar-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #bb86fc;
      --border-color: #333;
      --room-bg: #222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #menu-btn {
      display: none;
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background-color: var(--sidebar-bg);
      color: var(--accent-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .sidebar {
      width: 320px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      z-index: 1001;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    h2 {
      color: var(--accent-color);
      font-size: 1.1rem;
    }

    #close-menu-btn {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
    }

    label {
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="number"],
    input[type="text"],
    input[type="color"],
    input[type="range"] {
      background-color: #333;
      color: white;
      border: 1px solid #555;
      padding: 5px;
      border-radius: 4px;
      width: 110px;
    }

    input[type="range"] {
      width: 120px;
    }

    button {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.8;
    }

    .btn-group {
      display: flex;
      gap: 5px;
    }

    .btn-group button {
      flex: 1;
      margin-top: 0;
      font-size: 0.85rem;
      padding: 10px 5px;
    }

    .main-area {
      flex-grow: 1;
      display: flex;
      overflow: hidden;
      background-color: #1a1a1a;
      background-image: radial-gradient(#333 1px, transparent 1px);
      background-size: 20px 20px;
      touch-action: none;
    }

    #workspace {
      width: 100%;
      height: 100%;
      position: relative;
      transform-origin: 0 0;
      touch-action: none;
    }

    .room {
      position: absolute;
      background-color: transparent;
      z-index: 1;
      touch-action: none;
      overflow: visible;
    }

    .furniture {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.8);
      user-select: none;
      text-align: center;
      transform-origin: center center;
      touch-action: none;
    }

    /* Dynamic Tool Cursors */
    .main-area[data-tool="pan"],
    .main-area[data-tool="pan"] .room,
    .main-area[data-tool="pan"] .furniture {
      cursor: grab !important;
    }

    .main-area[data-tool="pan"]:active,
    .main-area[data-tool="pan"]:active .room,
    .main-area[data-tool="pan"]:active .furniture {
      cursor: grabbing !important;
    }

    .main-area[data-tool="move"] {
      cursor: grab;
    }

    .main-area[data-tool="move"]:active {
      cursor: grabbing;
    }

    .main-area[data-tool="move"] .room,
    .main-area[data-tool="move"] .furniture {
      cursor: grab !important;
    }

    .main-area[data-tool="move"] .room:active,
    .main-area[data-tool="move"] .furniture:active {
      cursor: grabbing !important;
    }

    .main-area[data-tool="cut"],
    .main-area[data-tool="cut"] .room,
    .main-area[data-tool="cut"] .furniture {
      cursor: crosshair !important;
    }

    .selected {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
    }

    .furniture.selected {
      box-shadow: 0 0 10px var(--accent-color);
    }

    /* Distance Indicators */
    #indicators {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    .dist-line {
      position: absolute;
      background-color: #f1c40f;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #line-top,
    #line-bottom {
      width: 1px;
    }

    #line-left,
    #line-right {
      height: 1px;
    }

    .dist-label {
      background-color: #f1c40f;
      color: #000;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 4px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* Cutout Preview UI */
    .cut-preview {
      position: absolute;
      background: rgba(231, 76, 60, 0.4);
      border: 2px dashed #e74c3c;
      pointer-events: none;
      z-index: 9998;
    }

    .cut-label {
      position: absolute;
      background: #e74c3c;
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .cut-label-w {
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
    }

    .cut-label-h {
      left: -50px;
      top: 50%;
      transform: translateY(-50%);
    }

    @media (max-width: 768px) {
      #menu-btn {
        display: block;
      }

      .sidebar {
        position: fixed;
        height: 100vh;
        left: 0;
        top: 0;
        transform: translateX(-100%);
        box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      #close-menu-btn {
        display: block;
      }
    }
  </style>
</head>

<body>

  <button id="menu-btn" onclick="toggleSidebar()">☰ Menu</button>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 style="border:none; margin:0; padding:0;">Planner Controls</h2>
      <button id="close-menu-btn" onclick="toggleSidebar()">✕</button>
    </div>

    <div class="control-group">
      <div class="btn-group">
        <button id="btn-tool-pan" onclick="setTool('pan')" style="opacity: 1;">✋ Pan</button>
        <button id="btn-tool-move" onclick="setTool('move')" style="opacity: 0.5;">🖐️ Move</button>
        <button id="btn-tool-cut" onclick="setTool('cut')" style="opacity: 0.5;">✂️ Cut</button>
      </div>
    </div>

    <div>
      <h2 style="border-bottom: 1px solid #333; padding-bottom: 5px; margin-top:10px;">View</h2>
      <div class="control-group">
        <label>Zoom: <span id="zoom-val">100%</span></label>
        <div class="btn-group">
          <button onclick="changeZoom(-0.5)">-</button>
          <button onclick="changeZoom(0.5)">+</button>
          <button onclick="resetZoom()">Reset</button>
        </div>
      </div>
    </div>

    <div>
      <h2>Add Room</h2>
      <div class="control-group">
        <label>Width: <input type="number" id="new-r-width" value="400"></label>
        <label>Height: <input type="number" id="new-r-height" value="400"></label>
        <label>Color: <input type="color" id="new-r-color" value="#222222"></label>
        <button onclick="addRoomBtn()">Add New Room</button>
      </div>
    </div>

    <div>
      <h2>Add Furniture</h2>
      <div class="control-group">
        <label>Name: <input type="text" id="new-f-name" value="Sofa"></label>
        <label>Width: <input type="number" id="new-f-width" value="200"></label>
        <label>Height: <input type="number" id="new-f-height" value="90"></label>
        <label>Color: <input type="color" id="new-f-color" value="#4a90e2"></label>
        <button onclick="addFurniture()">Add Item to Room</button>
      </div>
    </div>

    <div id="edit-panel" style="display: none;">
      <h2 id="edit-title">Edit Item</h2>
      <div class="control-group">

        <div id="edit-name-group" style="display: flex; flex-direction: column; gap: 8px;">
          <label>Name: <input type="text" id="edit-name" oninput="updateSelected()"></label>
        </div>

        <div id="edit-dim-group" style="display: flex; flex-direction: column; gap: 8px;">
          <label>Width: <input type="number" id="edit-w" oninput="updateSelected()"></label>
          <label>Height: <input type="number" id="edit-h" oninput="updateSelected()"></label>
        </div>

        <label>Color: <input type="color" id="edit-color" oninput="updateSelected()"></label>

        <div id="edit-furn-group" style="display: flex; flex-direction: column; gap: 8px;">
          <label>Rotation: <input type="range" id="edit-rotation" min="0" max="360" value="0"
              oninput="updateSelected()"></label>
          <label>Opacity: <input type="range" id="edit-opacity" min="0.1" max="1" step="0.1" value="1"
              oninput="updateSelected()"></label>
          <label>Z-Index: <input type="number" id="edit-zindex" value="10" oninput="updateSelected()"></label>
        </div>

        <button onclick="deleteSelected()" style="background-color: #cf6679; color: white;">Delete Item</button>
      </div>
    </div>
  </div>

  <div class="main-area" id="main-area" data-tool="pan">
    <div id="workspace">
      <div id="indicators">
        <div id="line-top" class="dist-line"><span class="dist-label"></span></div>
        <div id="line-bottom" class="dist-line"><span class="dist-label"></span></div>
        <div id="line-left" class="dist-line"><span class="dist-label"></span></div>
        <div id="line-right" class="dist-line"><span class="dist-label"></span></div>
      </div>
    </div>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const workspace = document.getElementById('workspace');
    const mainArea = document.getElementById('main-area');
    const editPanel = document.getElementById('edit-panel');
    const zoomValDisplay = document.getElementById('zoom-val');
    const indicatorsLayer = document.getElementById('indicators');

    const editName = document.getElementById('edit-name');
    const editColor = document.getElementById('edit-color');
    const editRotation = document.getElementById('edit-rotation');
    const editOpacity = document.getElementById('edit-opacity');
    const editZIndex = document.getElementById('edit-zindex');
    const editW = document.getElementById('edit-w');
    const editH = document.getElementById('edit-h');

    let selectedElement = null;
    let activeRoom = null;

    let currentTool = 'pan'; // Default tool is now Pan
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    let isCutting = false;
    let activeCutRoom = null;
    let cutPreview = null;
    let cutStartX = 0, cutStartY = 0;

    let currentScale = 1;
    let panX = 0, panY = 0;
    let isPanning = false;
    let startPanX = 0, startPanY = 0;
    let initialPinchDistance = null;
    let initialPinchScale = null;
    let initialPinchWorkspaceX = null;
    let initialPinchWorkspaceY = null;

    window.onload = () => {
      setTool('pan');
      loadLayout();
    };

    function setTool(tool) {
      currentTool = tool;
      document.getElementById('btn-tool-pan').style.opacity = tool === 'pan' ? '1' : '0.5';
      document.getElementById('btn-tool-move').style.opacity = tool === 'move' ? '1' : '0.5';
      document.getElementById('btn-tool-cut').style.opacity = tool === 'cut' ? '1' : '0.5';
      mainArea.dataset.tool = tool; // CSS handles cursor updates via this attribute
    }

    function toggleSidebar() { sidebar.classList.toggle('open'); }

    // --- Geometric SVG Path Generator ---
    function getRoomPath(w, h, cutouts) {
      let xs = [0, w];
      let ys = [0, h];

      cutouts.forEach(c => {
        if (c.x > 0 && c.x < w) xs.push(c.x);
        if (c.x + c.w > 0 && c.x + c.w < w) xs.push(c.x + c.w);
        if (c.y > 0 && c.y < h) ys.push(c.y);
        if (c.y + c.h > 0 && c.y + c.h < h) ys.push(c.y + c.h);
      });
      xs = [...new Set(xs)].sort((a, b) => a - b);
      ys = [...new Set(ys)].sort((a, b) => a - b);

      let grid = Array(ys.length - 1).fill(0).map(() => Array(xs.length - 1).fill(true));

      cutouts.forEach(c => {
        let startCol = xs.indexOf(Math.max(0, c.x));
        let endCol = xs.indexOf(Math.min(w, c.x + c.w));
        let startRow = ys.indexOf(Math.max(0, c.y));
        let endRow = ys.indexOf(Math.min(h, c.y + c.h));
        if (startCol === -1 || endCol === -1 || startRow === -1 || endRow === -1) return;

        for (let r = startRow; r < endRow; r++) {
          for (let col = startCol; col < endCol; col++) {
            grid[r][col] = false;
          }
        }
      });

      let segments = [];
      for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[r].length; c++) {
          if (grid[r][c]) {
            let left = xs[c], right = xs[c + 1], top = ys[r], bottom = ys[r + 1];
            if (r === 0 || !grid[r - 1][c]) segments.push({ x1: left, y1: top, x2: right, y2: top });
            if (r === grid.length - 1 || !grid[r + 1][c]) segments.push({ x1: right, y1: bottom, x2: left, y2: bottom });
            if (c === 0 || !grid[r][c - 1]) segments.push({ x1: left, y1: bottom, x2: left, y2: top });
            if (c === grid[r].length - 1 || !grid[r][c + 1]) segments.push({ x1: right, y1: top, x2: right, y2: bottom });
          }
        }
      }

      let loops = [];
      while (segments.length > 0) {
        let current = segments.shift();
        let loop = [current];
        while (true) {
          let tail = loop[loop.length - 1];
          let nextIdx = segments.findIndex(s => Math.abs(s.x1 - tail.x2) < 0.1 && Math.abs(s.y1 - tail.y2) < 0.1);
          if (nextIdx !== -1) {
            loop.push(segments[nextIdx]);
            segments.splice(nextIdx, 1);
          } else break;
        }
        loops.push(loop);
      }

      let pathStr = "";
      loops.forEach(loop => {
        pathStr += `M ${loop[0].x1} ${loop[0].y1} `;
        loop.forEach(seg => pathStr += `L ${seg.x2} ${seg.y2} `);
        pathStr += "Z ";
      });
      return pathStr || `M 0 0 L ${w} 0 L ${w} ${h} L 0 ${h} Z`;
    }

    function updateRoomShape(r) {
      const w = parseFloat(r.style.width);
      const h = parseFloat(r.style.height);
      const color = r.dataset.bgColor || '#222222';
      let cutouts = [];
      try { cutouts = JSON.parse(r.dataset.cutouts || '[]'); } catch (e) { }

      const pathStr = getRoomPath(w, h, cutouts);

      let svg = r.querySelector('.room-svg');
      if (!svg) {
        svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'room-svg');
        svg.style.position = 'absolute';
        svg.style.top = '0';
        svg.style.left = '0';
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.overflow = 'visible';
        svg.style.pointerEvents = 'none';

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.style.pointerEvents = 'auto';
        path.setAttribute('stroke', '#555');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('stroke-dasharray', '4');
        path.style.filter = 'drop-shadow(0px 0px 10px rgba(0,0,0,0.5))';

        svg.appendChild(path);
        r.insertBefore(svg, r.firstChild);
      }
      const path = svg.querySelector('path');
      path.setAttribute('d', pathStr);
      path.setAttribute('fill', color);

      if (r.classList.contains('selected')) {
        path.setAttribute('stroke', 'var(--accent-color)');
        path.style.filter = 'drop-shadow(0px 0px 10px var(--accent-color))';
      } else {
        path.setAttribute('stroke', '#555');
        path.style.filter = 'drop-shadow(0px 0px 10px rgba(0,0,0,0.5))';
      }
    }

    // --- Core Zoom & Pan Logic ---
    function zoomAt(newScale, screenX, screenY, animate = false) {
      workspace.style.transition = animate ? 'transform 0.2s ease-out' : 'none';
      const rect = mainArea.getBoundingClientRect();
      const mouseX = screenX - rect.left;
      const mouseY = screenY - rect.top;
      const workspaceX = (mouseX - panX) / currentScale;
      const workspaceY = (mouseY - panY) / currentScale;

      currentScale = newScale;
      panX = mouseX - workspaceX * currentScale;
      panY = mouseY - workspaceY * currentScale;
      applyTransform();
    }

    function changeZoom(delta) {
      let newScale = currentScale + delta;
      newScale = Math.round(newScale * 10) / 10;
      if (newScale < 0.2) newScale = 0.2;
      if (newScale > 5) newScale = 5;

      const rect = mainArea.getBoundingClientRect();
      zoomAt(newScale, rect.left + rect.width / 2, rect.top + rect.height / 2, true);
    }

    function resetZoom() {
      currentScale = 1;
      centerView(true);
    }

    function applyTransform() {
      workspace.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
      zoomValDisplay.innerText = Math.round(currentScale * 100) + '%';
      mainArea.style.backgroundPosition = `${panX}px ${panY}px`;
    }

    function centerView(animate = false) {
      const rooms = document.querySelectorAll('.room');
      if (rooms.length === 0) return;

      workspace.style.transition = animate ? 'transform 0.2s ease-out' : 'none';
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

      rooms.forEach(r => {
        const left = parseFloat(r.style.left) || 0;
        const top = parseFloat(r.style.top) || 0;
        const w = parseFloat(r.style.width) || 0;
        const h = parseFloat(r.style.height) || 0;

        if (left < minX) minX = left;
        if (left + w > maxX) maxX = left + w;
        if (top < minY) minY = top;
        if (top + h > maxY) maxY = top + h;
      });

      const contentCenterX = minX + (maxX - minX) / 2;
      const contentCenterY = minY + (maxY - minY) / 2;
      const rect = mainArea.getBoundingClientRect();

      panX = (rect.width / 2) - (contentCenterX * currentScale);
      panY = (rect.height / 2) - (contentCenterY * currentScale);
      applyTransform();
    }

    mainArea.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomDelta = e.deltaY < 0 ? 0.1 : -0.1;
      let newScale = currentScale + zoomDelta;
      newScale = Math.round(newScale * 100) / 100;
      if (newScale < 0.2) newScale = 0.2;
      if (newScale > 5) newScale = 5;
      zoomAt(newScale, e.clientX, e.clientY, false);
    }, { passive: false });

    mainArea.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        isPanning = false;
        isDragging = false;
        isCutting = false;
        if (cutPreview) {
          cutPreview.remove();
          cutPreview = null;
        }

        // Dropping selection when user initiates multi-touch pinch to pan/zoom
        if (selectedElement) {
          selectedElement.classList.remove('selected');
          if (selectedElement.classList.contains('room')) updateRoomShape(selectedElement);
          selectedElement = null;
          editPanel.style.display = 'none';
          indicatorsLayer.style.display = 'none';
        }

        const p1 = e.touches[0];
        const p2 = e.touches[1];
        const dist = Math.hypot(p2.clientX - p1.clientX, p2.clientY - p1.clientY);
        const centerX = (p1.clientX + p2.clientX) / 2;
        const centerY = (p1.clientY + p2.clientY) / 2;

        if (!initialPinchDistance) {
          initialPinchDistance = dist;
          initialPinchScale = currentScale;
          const rect = mainArea.getBoundingClientRect();
          initialPinchWorkspaceX = (centerX - rect.left - panX) / currentScale;
          initialPinchWorkspaceY = (centerY - rect.top - panY) / currentScale;
        } else {
          const scaleChange = dist / initialPinchDistance;
          let newScale = initialPinchScale * scaleChange;
          if (newScale < 0.2) newScale = 0.2;
          if (newScale > 5) newScale = 5;
          currentScale = newScale;

          const rect = mainArea.getBoundingClientRect();
          panX = (centerX - rect.left) - initialPinchWorkspaceX * currentScale;
          panY = (centerY - rect.top) - initialPinchWorkspaceY * currentScale;

          workspace.style.transition = 'none';
          applyTransform();
        }
      }
    }, { passive: false });

    mainArea.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
    });

    // --- Core Cutting Logic Helper ---
    function startCut(e, roomToCut) {
      isCutting = true;
      activeCutRoom = roomToCut;

      const rect = activeCutRoom.getBoundingClientRect();
      cutStartX = (e.clientX - rect.left) / currentScale;
      cutStartY = (e.clientY - rect.top) / currentScale;

      cutPreview = document.createElement('div');
      cutPreview.className = 'cut-preview';
      cutPreview.innerHTML = `<div class="cut-label cut-label-w">0cm</div><div class="cut-label cut-label-h">0cm</div>`;
      activeCutRoom.appendChild(cutPreview);
    }

    // --- Single Pointer Events ---
    mainArea.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary) return;

      if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
        sidebar.classList.remove('open');
      }

      // Route 1: Pan Tool Always Pans
      if (currentTool === 'pan') {
        // Drop any active selection when panning
        if (selectedElement) {
          selectedElement.classList.remove('selected');
          if (selectedElement.classList.contains('room')) updateRoomShape(selectedElement);
          selectedElement = null;
          editPanel.style.display = 'none';
          indicatorsLayer.style.display = 'none';
        }

        workspace.style.transition = 'none';
        isPanning = true;
        startPanX = e.clientX - panX;
        startPanY = e.clientY - panY;
        return;
      }

      // Route 2: Cut Tool on Background
      if (currentTool === 'cut') {
        if (!activeRoom || !activeRoom.classList.contains('room')) {
          alert("Please select a room to cut first by clicking on it.");
          setTool('move');
          return;
        }
        startCut(e, activeRoom);
        return;
      }

      // Route 3: Move Tool on Background -> Deselect and Pan
      if (e.target.id === 'main-area' || e.target.id === 'workspace') {
        if (selectedElement) {
          selectedElement.classList.remove('selected');
          if (selectedElement.classList.contains('room')) updateRoomShape(selectedElement);
          selectedElement = null;
          editPanel.style.display = 'none';
          indicatorsLayer.style.display = 'none';
        }

        workspace.style.transition = 'none';
        isPanning = true;
        startPanX = e.clientX - panX;
        startPanY = e.clientY - panY;
      }
    });

    document.addEventListener('pointermove', (e) => {
      if (!e.isPrimary) return;

      if (isCutting && activeCutRoom && cutPreview) {
        const rect = activeCutRoom.getBoundingClientRect();
        let curX = (e.clientX - rect.left) / currentScale;
        let curY = (e.clientY - rect.top) / currentScale;

        let w = Math.round(Math.abs(curX - cutStartX));
        let h = Math.round(Math.abs(curY - cutStartY));
        let l = Math.round(Math.min(curX, cutStartX));
        let t = Math.round(Math.min(curY, cutStartY));

        cutPreview.style.width = w + 'px';
        cutPreview.style.height = h + 'px';
        cutPreview.style.left = l + 'px';
        cutPreview.style.top = t + 'px';

        const roomW = parseFloat(activeCutRoom.style.width) || 0;
        const roomH = parseFloat(activeCutRoom.style.height) || 0;

        const overlapL = Math.max(0, l);
        const overlapT = Math.max(0, t);
        const overlapR = Math.min(roomW, l + w);
        const overlapB = Math.min(roomH, t + h);

        const effW = Math.max(0, overlapR - overlapL);
        const effH = Math.max(0, overlapB - overlapT);

        cutPreview.querySelector('.cut-label-w').innerText = Math.round(effW) + 'cm';
        cutPreview.querySelector('.cut-label-h').innerText = Math.round(effH) + 'cm';
      }
      else if (isDragging && selectedElement && currentTool === 'move') {
        const dx = (e.clientX - startX) / currentScale;
        const dy = (e.clientY - startY) / currentScale;
        selectedElement.style.left = (initialLeft + dx) + 'px';
        selectedElement.style.top = (initialTop + dy) + 'px';
        updateIndicators();
      }
      else if (isPanning) {
        panX = e.clientX - startPanX;
        panY = e.clientY - startPanY;
        applyTransform();
      }
    });

    document.addEventListener('pointerup', (e) => {
      if (!e.isPrimary) return;

      if (isCutting) {
        isCutting = false;
        if (cutPreview) {
          let w = parseInt(cutPreview.style.width) || 0;
          let h = parseInt(cutPreview.style.height) || 0;
          let l = parseInt(cutPreview.style.left) || 0;
          let t = parseInt(cutPreview.style.top) || 0;

          if (w > 5 && h > 5) {
            let cutouts = [];
            try { cutouts = JSON.parse(activeCutRoom.dataset.cutouts || '[]'); } catch (e) { }
            cutouts.push({ x: l, y: t, w: w, h: h });
            activeCutRoom.dataset.cutouts = JSON.stringify(cutouts);
            updateRoomShape(activeCutRoom);
            saveLayout();
          }
          cutPreview.remove();
          cutPreview = null;
        }
      } else if (isDragging) {
        saveLayout();
      }

      isDragging = false;
      isPanning = false;
    });

    function selectItem(e) {
      if (e.stopPropagation) e.stopPropagation();

      let targetElem = e.target.closest('.furniture') || e.target.closest('.room');
      if (!targetElem) return;

      if (selectedElement) {
        selectedElement.classList.remove('selected');
        if (selectedElement.classList.contains('room')) updateRoomShape(selectedElement);
      }

      selectedElement = targetElem;
      selectedElement.classList.add('selected');

      editPanel.style.display = 'block';
      const isRoom = selectedElement.classList.contains('room');

      if (isRoom) {
        activeRoom = selectedElement;
        updateRoomShape(activeRoom);
      } else {
        activeRoom = selectedElement.parentElement;
      }

      document.getElementById('edit-name-group').style.display = isRoom ? 'none' : 'flex';
      document.getElementById('edit-dim-group').style.display = 'flex';
      document.getElementById('edit-furn-group').style.display = isRoom ? 'none' : 'flex';
      document.getElementById('edit-title').innerText = isRoom ? 'Edit Room' : 'Edit Furniture';

      editColor.value = isRoom ? (selectedElement.dataset.bgColor || '#222222') : rgb2hex(selectedElement.style.backgroundColor);
      editW.value = parseFloat(selectedElement.style.width);
      editH.value = parseFloat(selectedElement.style.height);

      if (!isRoom) {
        editName.value = selectedElement.innerText;
        editRotation.value = selectedElement.dataset.rotation || 0;
        editOpacity.value = selectedElement.style.opacity || 1;
        editZIndex.value = selectedElement.style.zIndex || 10;
      }

      updateIndicators();
    }

    function updateSelected() {
      if (!selectedElement) return;
      const isRoom = selectedElement.classList.contains('room');

      selectedElement.style.width = editW.value + 'px';
      selectedElement.style.height = editH.value + 'px';

      if (isRoom) {
        selectedElement.dataset.bgColor = editColor.value;
        updateRoomShape(selectedElement);
      } else {
        selectedElement.style.backgroundColor = editColor.value;
        selectedElement.innerText = editName.value;
        selectedElement.dataset.rotation = editRotation.value;
        selectedElement.style.transform = `rotate(${editRotation.value}deg)`;
        selectedElement.style.opacity = editOpacity.value;
        selectedElement.style.zIndex = editZIndex.value;
      }
      updateIndicators();
      saveLayout();
    }

    function deleteSelected() {
      if (selectedElement) {
        if (selectedElement.classList.contains('room')) {
          workspace.appendChild(indicatorsLayer);
          if (activeRoom === selectedElement) activeRoom = null;
        }
        selectedElement.remove();
        selectedElement = null;
        editPanel.style.display = 'none';
        indicatorsLayer.style.display = 'none';
        saveLayout();
      }
    }

    function startDragElement(e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (!e.isPrimary) return;

      let targetElem = e.target.closest('.furniture') || e.target.closest('.room');
      if (!targetElem) return;

      // If Pan Tool is active, bubble up to mainArea for global panning
      if (currentTool === 'pan') {
        return;
      }

      if (currentTool === 'cut') {
        if (targetElem.classList.contains('room')) {
          if (e.stopPropagation) e.stopPropagation();
          if (selectedElement !== targetElem) {
            selectItem({ ...e, target: targetElem, stopPropagation: () => { } });
          }
          startCut(e, targetElem);
        }
        return;
      }

      if (e.stopPropagation) e.stopPropagation();
      isDragging = true;
      if (selectedElement !== targetElem) selectItem({ ...e, target: targetElem, stopPropagation: () => { } });

      startX = e.clientX;
      startY = e.clientY;
      initialLeft = parseFloat(selectedElement.style.left) || 0;
      initialTop = parseFloat(selectedElement.style.top) || 0;
    }

    function updateIndicators() {
      if (!selectedElement || !selectedElement.classList.contains('furniture')) {
        indicatorsLayer.style.display = 'none';
        return;
      }
      indicatorsLayer.style.display = 'block';

      const currentRoom = selectedElement.parentElement;
      currentRoom.appendChild(indicatorsLayer);

      const w = parseFloat(selectedElement.style.width);
      const h = parseFloat(selectedElement.style.height);
      const left = parseFloat(selectedElement.style.left);
      const top = parseFloat(selectedElement.style.top);
      const angle = parseFloat(selectedElement.dataset.rotation || 0) * (Math.PI / 180);

      const cx = left + w / 2;
      const cy = top + h / 2;
      const dx = w / 2;
      const dy = h / 2;
      const corners = [
        { x: -dx, y: -dy }, { x: dx, y: -dy },
        { x: dx, y: dy }, { x: -dx, y: dy }
      ];

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      corners.forEach(c => {
        const rx = c.x * Math.cos(angle) - c.y * Math.sin(angle);
        const ry = c.x * Math.sin(angle) + c.y * Math.cos(angle);
        const absX = cx + rx;
        const absY = cy + ry;
        if (absX < minX) minX = absX;
        if (absX > maxX) maxX = absX;
        if (absY < minY) minY = absY;
        if (absY > maxY) maxY = absY;
      });

      const roomW = parseFloat(currentRoom.style.width) || currentRoom.offsetWidth;
      const roomH = parseFloat(currentRoom.style.height) || currentRoom.offsetHeight;

      const distTop = Math.round(minY);
      const distBottom = Math.round(roomH - maxY);
      const distLeft = Math.round(minX);
      const distRight = Math.round(roomW - maxX);

      const centerBoundsX = (minX + maxX) / 2;
      const centerBoundsY = (minY + maxY) / 2;

      const lineT = document.getElementById('line-top');
      lineT.style.left = centerBoundsX + 'px';
      lineT.style.top = '0px';
      lineT.style.height = Math.max(0, minY) + 'px';
      lineT.querySelector('.dist-label').innerText = distTop + 'cm';

      const lineB = document.getElementById('line-bottom');
      lineB.style.left = centerBoundsX + 'px';
      lineB.style.top = maxY + 'px';
      lineB.style.height = Math.max(0, roomH - maxY) + 'px';
      lineB.querySelector('.dist-label').innerText = distBottom + 'cm';

      const lineL = document.getElementById('line-left');
      lineL.style.top = centerBoundsY + 'px';
      lineL.style.left = '0px';
      lineL.style.width = Math.max(0, minX) + 'px';
      lineL.querySelector('.dist-label').innerText = distLeft + 'cm';

      const lineR = document.getElementById('line-right');
      lineR.style.top = centerBoundsY + 'px';
      lineR.style.left = maxX + 'px';
      lineR.style.width = Math.max(0, roomW - maxX) + 'px';
      lineR.querySelector('.dist-label').innerText = distRight + 'cm';
    }

    function saveLayout() {
      const layout = [];
      document.querySelectorAll('.room').forEach(r => {
        const roomData = {
          w: r.style.width,
          h: r.style.height,
          bg: r.dataset.bgColor || '#222222',
          left: r.style.left,
          top: r.style.top,
          cutouts: JSON.parse(r.dataset.cutouts || '[]'),
          furniture: []
        };

        r.querySelectorAll('.furniture').forEach(f => {
          roomData.furniture.push({
            name: f.innerText,
            w: f.style.width,
            h: f.style.height,
            bg: rgb2hex(f.style.backgroundColor),
            left: f.style.left,
            top: f.style.top,
            rotation: f.dataset.rotation || 0,
            opacity: f.style.opacity || 1,
            zIndex: f.style.zIndex || 10
          });
        });
        layout.push(roomData);
      });

      const jsonStr = JSON.stringify(layout);
      localStorage.setItem('roomPlannerLayout', jsonStr);

      try {
        const bytes = new TextEncoder().encode(jsonStr);
        let binString = '';
        for (let i = 0; i < bytes.byteLength; i++) binString += String.fromCharCode(bytes[i]);
        window.history.replaceState(null, '', '#' + btoa(binString));
      } catch (e) { }
    }

    function loadLayout() {
      let layoutData = null;
      if (window.location.hash.length > 1) {
        try {
          const binString = atob(window.location.hash.substring(1));
          const bytes = new Uint8Array(binString.length);
          for (let i = 0; i < binString.length; i++) bytes[i] = binString.charCodeAt(i);
          layoutData = JSON.parse(new TextDecoder().decode(bytes));
        } catch (e) { }
      }

      if (!layoutData) {
        const saved = localStorage.getItem('roomPlannerLayout');
        if (saved) {
          try { layoutData = JSON.parse(saved); } catch (e) { }
        }
      }

      if (layoutData && layoutData.length > 0) {
        layoutData.forEach(rData => {
          const r = document.createElement('div');
          r.className = 'room';
          r.style.width = rData.w;
          r.style.height = rData.h;
          r.dataset.bgColor = rData.bg;
          r.style.left = rData.left;
          r.style.top = rData.top;
          r.dataset.cutouts = JSON.stringify(rData.cutouts || []);

          updateRoomShape(r);
          r.addEventListener('pointerdown', startDragElement);
          workspace.appendChild(r);

          rData.furniture.forEach(fData => {
            const f = document.createElement('div');
            f.className = 'furniture';
            f.innerText = fData.name;
            f.style.width = fData.w;
            f.style.height = fData.h;
            f.style.backgroundColor = fData.bg;
            f.style.left = fData.left;
            f.style.top = fData.top;
            f.dataset.rotation = fData.rotation;
            f.style.transform = `rotate(${fData.rotation}deg)`;
            f.style.opacity = fData.opacity;
            f.style.zIndex = fData.zIndex;

            f.addEventListener('pointerdown', startDragElement);
            r.appendChild(f);
          });
        });
      } else {
        addRoom(500, 500, '#222222');
      }

      setTimeout(() => { centerView(false); }, 50);
    }

    function addRoomBtn() {
      const w = parseInt(document.getElementById('new-r-width').value) || 400;
      const h = parseInt(document.getElementById('new-r-height').value) || 400;
      const color = document.getElementById('new-r-color').value || '#222222';
      addRoom(w, h, color);
    }

    function addRoom(w, h, color) {
      const r = document.createElement('div');
      r.className = 'room';
      r.style.width = w + 'px';
      r.style.height = h + 'px';
      r.dataset.bgColor = color;
      r.dataset.cutouts = '[]';

      const offset = document.querySelectorAll('.room').length * 30;
      r.style.left = (workspace.offsetWidth / 2 - w / 2 + offset) + 'px';
      r.style.top = (workspace.offsetHeight / 2 - h / 2 + offset) + 'px';

      updateRoomShape(r);
      r.addEventListener('pointerdown', startDragElement);
      workspace.appendChild(r);

      selectItem({ target: r, stopPropagation: () => { } });
      saveLayout();

      if (currentTool !== 'move') setTool('move');
    }

    function addFurniture() {
      if (!activeRoom || !activeRoom.classList.contains('room')) {
        alert("Please select a room to add furniture into!");
        if (window.innerWidth <= 768) toggleSidebar();
        return;
      }

      const name = document.getElementById('new-f-name').value;
      const w = document.getElementById('new-f-width').value;
      const h = document.getElementById('new-f-height').value;
      const color = document.getElementById('new-f-color').value;

      const item = document.createElement('div');
      item.className = 'furniture';
      item.innerText = name;
      item.style.width = w + 'px';
      item.style.height = h + 'px';
      item.style.backgroundColor = color;

      item.dataset.rotation = 0;
      item.style.transform = `rotate(0deg)`;
      item.style.opacity = 1;
      item.style.zIndex = 10;

      item.style.left = (activeRoom.offsetWidth / 2 - w / 2) + 'px';
      item.style.top = (activeRoom.offsetHeight / 2 - h / 2) + 'px';

      item.addEventListener('pointerdown', startDragElement);
      activeRoom.appendChild(item);

      selectItem({ target: item, stopPropagation: () => { } });
      saveLayout();

      if (currentTool !== 'move') setTool('move');
    }

    function rgb2hex(rgb) {
      if (!rgb) return '#222222';
      if (rgb.search("rgb") === -1) return rgb;
      const match = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*(\d+(?:\.\d+)?))?\)$/);
      if (!match) return rgb;
      function hex(x) { return ("0" + parseInt(x).toString(16)).slice(-2); }
      return "#" + hex(match[1]) + hex(match[2]) + hex(match[3]);
    }
  </script>
</body>
